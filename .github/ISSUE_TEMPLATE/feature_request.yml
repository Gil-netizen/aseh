name: Feature request
description: Propose a user-facing capability or repository improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or need
      description: Who has this need, in what context, and what cannot they do today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the observable result without prescribing an implementation unless the constraint is essential.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and references
      description: Provide user research, authoritative specifications, exact source references, or comparable behavior that supports the request.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints and edge cases
      description: Include offline behavior, accessibility, RTL/LTR, privacy, licensing, source disagreement, and compatibility concerns where relevant.
  - type: dropdown
    id: consequence
    attributes:
      label: Could this affect high-consequence guidance or normative rules?
      description: Uncertain proposals are reviewed as high consequence until classified.
      options:
        - "No"
        - "Yes"
        - Uncertain
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance examples
      description: Give concrete scenarios that would show the feature works.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues and discussions for this request.
          required: true
        - label: I have not included secrets, private case material, or personal information.
          required: true
