name: Alpha 7 review assets

on:
  push:
    branches:
      - codex/shabbat-rehearsal-alpha7
    paths:
      - .github/workflows/alpha7-review-assets.yml

permissions:
  contents: write

concurrency:
  group: alpha7-review-assets
  cancel-in-progress: false

jobs:
  upload:
    name: Build and attach review APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out review branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Temurin 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17.0.20+101'
          check-latest: false
          verify-signature: true

      - name: Set up Android command-line tools 22.0
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '15859902'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: >-
            platform-tools platforms;android-37.0 build-tools;37.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          validate-wrappers: true

      - name: Build review APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace --dependency-verification strict :app:assembleDevDebug

      - name: Record artifact evidence
        id: evidence
        shell: bash
        run: |
          set -euo pipefail
          apk='app/build/outputs/apk/dev/debug/app-dev-debug.apk'
          output='ASEH-0.1.0-alpha.7-dev-debug.apk'
          cp "$apk" "$output"
          sha256sum "$output" > SHA256SUMS.txt
          signer="$("$ANDROID_SDK_ROOT/build-tools/37.0.0/apksigner" verify --print-certs "$output" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)"
          {
            printf 'source_revision=%s\n' "$GITHUB_SHA"
            printf 'filename=%s\n' "$output"
            printf 'size_bytes=%s\n' "$(stat -c%s "$output")"
            printf 'sha256=%s\n' "$(sha256sum "$output" | awk '{print $1}')"
            printf 'signer_sha256=%s\n' "$signer"
            printf 'package=io.github.gilnetizen.aseh.dev.alpha7.debug\n'
            printf 'version_name=0.1.0-alpha.7-dev-debug\n'
            printf 'release_id=405316778\n'
            printf 'release_state=draft-unpublished\n'
          } | tee BUILD-METADATA.txt

      - name: Attach assets to unpublished draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          upload() {
            local file="$1"
            local content_type="$2"
            curl --fail-with-body --silent --show-error --location               --request POST               --header "Authorization: Bearer $GH_TOKEN"               --header "Accept: application/vnd.github+json"               --header "X-GitHub-Api-Version: 2022-11-28"               --header "Content-Type: $content_type"               --data-binary "@$file"               "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/405316778/assets?name=$(basename "$file")"
          }
          upload ASEH-0.1.0-alpha.7-dev-debug.apk application/vnd.android.package-archive
          upload SHA256SUMS.txt text/plain
          upload BUILD-METADATA.txt text/plain
