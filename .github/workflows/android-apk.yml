name: Android APK

on:
  push:
    branches:
      - codex/shabbat-rehearsal-alpha7
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build and publish downloadable APK
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Temurin 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17.0.20+101'
          check-latest: false
          verify-signature: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '15859902'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: >-
            platform-tools platforms;android-37.0 build-tools;37.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          validate-wrappers: true

      - name: Build APK
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --dependency-verification strict :app:assembleDevDebug

      - name: Publish APK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ASEH-0.1.0-alpha.8-dev-debug-apk
          path: app/build/outputs/apk/dev/debug/app-dev-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct APK download
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: '405516521'
          TAG_NAME: v0.1.0-alpha.8
          ASSET_NAME: ASEH-0.1.0-alpha.8-dev-debug.apk
        run: |
          set -euo pipefail
          apk_path='app/build/outputs/apk/dev/debug/app-dev-debug.apk'
          existing_asset_id="$(gh api "/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" --jq ".[] | select(.name == \"${ASSET_NAME}\") | .id" | head -n 1)"
          if [[ -n "${existing_asset_id}" ]]; then
            gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/releases/assets/${existing_asset_id}"
          fi
          curl --fail-with-body --location --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --header 'Content-Type: application/vnd.android.package-archive' \
            --data-binary "@${apk_path}" \
            "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?name=${ASSET_NAME}&label=ASEH%20alpha%208%20debug%20APK"
          gh api --method PATCH "/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -F draft=false \
            -F prerelease=true \
            -f make_latest=false \
            -f tag_name="${TAG_NAME}" \
            -f name='ASEH 0.1.0-alpha.8' >/dev/null
