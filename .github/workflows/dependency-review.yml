name: Dependency review

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gradle-dependency-submission:
    name: Gradle dependency submission
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Temurin 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17.0.20+101'
          check-latest: false
          verify-signature: true

      - name: Install pinned Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '15859902'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: >-
            platform-tools platforms;android-37.0 build-tools;37.0.0

      - name: Submit locked compile and runtime dependency graph
        uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          additional-arguments: --no-configuration-cache
          cache-provider: basic
          cache-read-only: true
          dependency-graph: generate-and-submit
          # AGP creates transient metadata configurations that intentionally
          # have no lock state. Compile/runtime classpaths are fully locked and
          # cover the dependencies shipped or compiled into every variant.
          dependency-graph-include-configurations: '.*(?:Compile|Runtime)Classpath'
          validate-wrappers: true

  vulnerability-scan:
    name: GitHub dependency review
    needs: gradle-dependency-submission
    if: >-
      always() &&
      (needs.gradle-dependency-submission.result == 'success' ||
      needs.gradle-dependency-submission.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Reject newly introduced dependency vulnerabilities
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development, unknown
          license-check: false
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 600
          show-openssf-scorecard: false
          show-patched-versions: true

  osv-lockfile-scan:
    name: OSV lockfile vulnerability scan
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
    with:
      # The GitHub review above enforces high and critical findings. OSV also
      # reports lower-severity advisories for explicit owner review.
      fail-on-vuln: false
      runs-on: ubuntu-24.04
      scan-args: |-
        --include-git-root
        --recursive
        ./
